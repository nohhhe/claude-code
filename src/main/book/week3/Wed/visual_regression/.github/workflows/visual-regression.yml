name: Visual Regression Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Percy Visual Tests (Page-level)
  # ============================================
  percy-tests:
    name: Percy Visual Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Build Next.js application
      run: npm run build

    - name: Start Next.js server and run Percy tests
      run: |
        npm start &
        npx wait-on http://localhost:3000 --timeout 60000
        npm run test:percy
      env:
        PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        CI: true

    - name: Upload Percy logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: percy-logs
        path: |
          .percy/
          logs/
        retention-days: 7

  # ============================================
  # Chromatic Visual Tests (Component-level)
  # ============================================
  chromatic-tests:
    name: Chromatic Visual Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for Chromatic to compare builds

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Storybook
      run: npm run build-storybook

    - name: Publish to Chromatic
      uses: chromaui/action@latest
      with:
        projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        storybookBuildDir: storybook-static
        exitZeroOnChanges: true
        exitOnceUploaded: true
        onlyChanged: true
        autoAcceptChanges: main
        skip: dependabot/**

    - name: Upload Storybook build
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: storybook-static
        path: storybook-static/
        retention-days: 7

  # ============================================
  # Playwright E2E Tests
  # ============================================
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Build Next.js application
      run: npm run build

    - name: Run Playwright tests
      run: npm run test
      env:
        CI: true

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-screenshots
        path: test-results/
        retention-days: 7

  # ============================================
  # Visual Regression Summary
  # ============================================
  visual-regression-summary:
    name: Visual Regression Summary
    runs-on: ubuntu-latest
    needs: [percy-tests, chromatic-tests, playwright-e2e]
    if: always()

    steps:
    - name: Check job results
      run: |
        echo "Percy Tests: ${{ needs.percy-tests.result }}"
        echo "Chromatic Tests: ${{ needs.chromatic-tests.result }}"
        echo "Playwright E2E: ${{ needs.playwright-e2e.result }}"

        if [ "${{ needs.percy-tests.result }}" == "failure" ] || \
           [ "${{ needs.chromatic-tests.result }}" == "failure" ] || \
           [ "${{ needs.playwright-e2e.result }}" == "failure" ]; then
          echo "Some visual regression tests failed!"
          exit 1
        fi

        echo "All visual regression tests passed!"
